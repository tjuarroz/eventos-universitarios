# Sistema de gestión de eventos universitarios con predicción de asistencia
# Levantar todo:  docker compose up --build   →  http://localhost:3000
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: eventos
      POSTGRES_USER: eventos
      POSTGRES_PASSWORD: ${DB_PASSWORD:-eventos}
      TZ: America/Argentina/Buenos_Aires
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro     # esquema + datos demo (solo en la primera vez)
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eventos -d eventos"]
      interval: 5s
      retries: 20

  analitica:
    build: ./analitica-python
    environment:
      JWT_SECRET: ${JWT_SECRET:-cambiar-este-secreto-compartido-por-java-y-python-2026}
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173
      DATA_DIR: /data
      TZ: America/Argentina/Buenos_Aires
    volumes:
      - modelos:/data
    ports:
      - "8000:8000"

  core:
    build: ./core-java
    environment:
      DB_URL: jdbc:postgresql://db:5432/eventos
      DB_USER: eventos
      DB_PASSWORD: ${DB_PASSWORD:-eventos}
      JWT_SECRET: ${JWT_SECRET:-cambiar-este-secreto-compartido-por-java-y-python-2026}
      ANALITICA_URL: http://analitica:8000
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173
      TZ: America/Argentina/Buenos_Aires
    depends_on:
      db:
        condition: service_healthy
      analitica:
        condition: service_started
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend
    depends_on:
      - core
      - analitica
    ports:
      - "3000:80"

volumes:
  pgdata:
  modelos:
